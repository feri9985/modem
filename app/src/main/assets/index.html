<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#10151c;--pn:#1a222d;--tx:#e8edf3;--mu:#8a97a8;--ac:#2f7bf5;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
.w{padding:12px;max-width:640px;margin:auto}h3{margin:14px 0 6px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid #2c3746;border-radius:8px;padding:10px;width:100%;margin:4px 0}
button{background:var(--ac);border:0;font-weight:600}button.g{background:#2c3746}button.r{background:var(--bad)}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0}nav button{background:#2c3746}nav button.on{background:var(--ac)}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #2c3746;word-break:break-all}td:first-child{color:var(--mu);width:45%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid label{background:var(--pn);padding:10px;border-radius:8px;display:block}
.grid input{width:auto;margin:0 6px 0 0}pre{background:#0b0f14;padding:8px;border-radius:8px;font-size:11px;white-space:pre-wrap;max-height:220px;overflow:auto}
.big{display:flex;gap:8px}.big div{flex:1;background:var(--pn);border-radius:8px;padding:10px;text-align:center}.big b{font-size:20px;display:block}
.hide{display:none}#err{color:var(--bad)}
</style></head><body><div class="w">
<div id="login"><h2>Modem Manager</h2>
<input id="ip" placeholder="Modem IP"><input id="user" value="admin"><input id="pw" type="password" placeholder="Password">
<button onclick="login()">Log in</button><p id="err"></p></div>
<div id="app" class="hide">
<nav><button class="on" onclick="tab('d',this)">Signal</button><button onclick="tab('b',this)">Bands</button><button onclick="tab('h',this)">Devices</button><button onclick="tab('t',this)">Tools</button></nav>
<section id="d"><div class="big"><div>Down<b id="dl">-</b></div><div>Up<b id="ul">-</b></div></div>
<h3>Signal</h3><table id="sig"></table><h3>Status</h3><table id="sta"></table></section>
<section id="b" class="hide"><h3>4G (LTE) bands</h3><div class="grid" id="lte"></div>
<h3>5G (NR) bands</h3><div class="grid" id="nr"></div><p id="nrnote"></p>
<button class="g" onclick="all_(true)">Select all</button><button onclick="saveBands()">Apply band lock</button></section>
<section id="h" class="hide"><button class="g" onclick="hosts()">Refresh</button><table id="hl"></table></section>
<section id="t" class="hide"><button class="r" onclick="reboot()">Reboot modem</button>
<h3>Explorer</h3><select id="em"><option>GET</option><option>POST</option></select>
<input id="ep" value="/api/net/net-mode"><textarea id="eb" rows="3" placeholder="XML body (POST)"></textarea>
<button class="g" onclick="explore()">Send</button><pre id="eo"></pre></section>
<h3>Log</h3><pre id="L"></pre></div></div>
<script>
const $=i=>document.getElementById(i);let cbs={},n=0,NM="";
const LTE=[1,2,3,4,5,7,8,12,13,17,18,19,20,25,26,28,32,34,38,39,40,41,42,43],NR=[1,3,5,7,8,20,28,38,40,41,77,78,79];
const call=(m,p,b="")=>new Promise(r=>{cbs[++n]=r;A.req(n,m,p,b)});
function cb(id,s){cbs[id](JSON.parse(s));delete cbs[id]}
const tag=(x,t)=>{const m=x.match(new RegExp("<"+t+">([^<]*)</"+t+">","i"));return m?m[1]:""};
const log=s=>{$("L").textContent=new Date().toLocaleTimeString()+" "+s+"\n"+$("L").textContent.slice(0,5000)};
async function api(m,p,b){const r=await call(m,p,b);log(m+" "+p+" -> "+r.s+" "+r.b.slice(0,400));return r.b}
const kv=x=>{const d=new DOMParser().parseFromString(x,"text/xml");return [...d.documentElement.children].filter(e=>!e.children.length&&e.textContent).map(e=>`<tr><td>${e.tagName}<td>${e.textContent}</tr>`).join("")};
const rate=v=>{v=+v*8;return v>1e6?(v/1e6).toFixed(1)+" Mbps":(v/1e3).toFixed(0)+" Kbps"};
$("ip").value=localStorage.ip||"192.168.8.1";
async function login(){$("err").textContent="Logging in...";const r=await call("LOGIN",$("ip").value,$("user").value+"\n"+$("pw").value);log(r.b);
 if(r.b=="OK"){localStorage.ip=$("ip").value;$("login").classList.add("hide");$("app").classList.remove("hide");tick();setInterval(tick,3000)}else $("err").textContent=r.b.slice(0,250)}
async function tick(){if(!$("d").classList.contains("hide")){
 $("sig").innerHTML=kv(await api("GET","/api/device/signal"));
 const t=await api("GET","/api/monitoring/traffic-statistics");$("dl").textContent=rate(tag(t,"CurrentDownloadRate"));$("ul").textContent=rate(tag(t,"CurrentUploadRate"));
 $("sta").innerHTML=kv(await api("GET","/api/monitoring/status"))}}
function tab(id,btn){["d","b","h","t"].forEach(i=>$(i).classList.toggle("hide",i!=id));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b==btn));
 if(id=="b")loadBands();if(id=="h")hosts();tick()}
function draw(id,f,list,pre){const v=BigInt("0x"+(tag(NM,f)||"0"));$(id).innerHTML=list.map(b=>`<label><input type=checkbox data-b=${b} ${(v>>BigInt(b-1))&1n?"checked":""}>${pre}${b}</label>`).join("")}
async function loadBands(){NM=await api("GET","/api/net/net-mode");draw("lte","LTEBand",LTE,"B");
 if(/<NRBand>/i.test(NM)){draw("nr","NRBand",NR,"n");$("nrnote").textContent=""}else{$("nr").innerHTML="";$("nrnote").textContent="This firmware does not expose NRBand in net-mode. Check the log/Explorer."}}
const mask=id=>{let v=0n;document.querySelectorAll("#"+id+" input:checked").forEach(i=>v|=1n<<BigInt(i.dataset.b-1));return v.toString(16).toUpperCase()}
function all_(on){document.querySelectorAll("#lte input,#nr input").forEach(i=>i.checked=on)}
async function saveBands(){if(mask("lte")=="0")return alert("Select at least one 4G band");
 let b='<?xml version="1.0" encoding="UTF-8"?><request>'+["NetworkMode","NetworkBand"].map(f=>`<${f}>${tag(NM,f)}</${f}>`).join("")+`<LTEBand>${mask("lte")}</LTEBand>`;
 if($("nr").children.length)b+=`<NRBand>${mask("nr")}</NRBand>`;b+="</request>";
 const r=await api("POST","/api/net/net-mode",b);alert(r.includes("OK")?"Applied":"Modem replied: "+r.slice(0,200))}
async function hosts(){const x=await api("GET","/api/lan/HostInfo"),d=new DOMParser().parseFromString(x,"text/xml");
 $("hl").innerHTML=[...d.querySelectorAll("Host")].map(h=>`<tr><td>${tag(h.outerHTML,"HostName")||"?"}<td>${tag(h.outerHTML,"IpAddress")}<br>${tag(h.outerHTML,"MacAddress")}</tr>`).join("")||kv(x)}
async function reboot(){if(confirm("Reboot modem?"))log(await api("POST","/api/device/control",'<?xml version="1.0" encoding="UTF-8"?><request><Control>1</Control></request>'))}
async function explore(){$("eo").textContent=await api($("em").value,$("ep").value,$("eb").value)}
</script></body></html>
